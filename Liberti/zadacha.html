<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Рабочая Задача — Матовое стекло и Неон</title>
    <style>
        /* Базовые настройки страницы */
body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Roboto, sans-serif;
    background-color: #0d0e15; /* Темная заглушка */
}

/* Общий контейнер */
.dashboard-container {
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: auto;
}

/* Стеклянные карточки (Glassmorphism + Свечение) */
.progress-card, .tasks-card, .modal-card {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 20px;
    padding: 25px;
    color: #ffffff;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 
                0 0 30px rgba(0, 242, 254, 0.1);
}

/* Заголовки и неоновые маркеры */
.progress-card h2 {
    margin: 0 0 15px 0;
    font-size: 22px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
}
.section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding-bottom: 10px;
}
.section-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
}
.section-badge {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}
.badge-blue { background: #00f2fe; box-shadow: 0 0 8px #00f2fe; }
.badge-purple { background: #b624ff; box-shadow: 0 0 8px #b624ff; }
.badge-green { background: #00ff87; box-shadow: 0 0 8px #00ff87; }

/* Три участка в ряд */
.board-sections {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    align-items: start;
}

/* Общая шкала прогресса */
.progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 8px;
}
.progress-bar-bg {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    height: 10px;
    overflow: hidden;
}
.progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f2fe, #b624ff);
    box-shadow: 0 0 15px #00f2fe;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Списки подзадач внутри участков */
.subtasks-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
    max-height: 400px;
    overflow-y: auto;
    padding-right: 3px;
}
.subtasks-list::-webkit-scrollbar { width: 3px; }
.subtasks-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

/* Карточка одной подзадачи */
.subtask-item {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 12px 15px;
    cursor: pointer;
    transition: all 0.2s ease;
    animation: fadeIn 0.25s ease forwards;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}
.subtask-item:hover {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.15);
}

/* Чекбокс */
.checkbox {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
}
.checkbox::after {
    content: '';
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    transform: scale(0);
    transition: transform 0.15s ease;
}

/* Кнопка крестика для удаления */
.delete-btn {
    margin-left: auto;
    color: rgba(255, 255, 255, 0.2);
    font-size: 18px;
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
}
.delete-btn:hover { color: #ff4a4a; text-shadow: 0 0 5px #ff4a4a; }

/* Выполненное состояние подзадачи */
.subtask-item.completed .checkbox {
    border-color: #00ff87;
    background: #00ff87;
    box-shadow: 0 0 8px #00ff87;
}
.subtask-item.completed .checkbox::after { transform: scale(1); }
.subtask-item.completed .task-text {
    color: rgba(255, 255, 255, 0.3);
    text-decoration: line-through;
}

/* Кнопки добавления на участках */
.add-task-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    color: rgba(255, 255, 255, 0.6);
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
}
.add-task-btn:hover {
    border-style: solid;
    border-color: rgba(0, 242, 254, 0.6);
    background: rgba(0, 242, 254, 0.05);
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
}

/* Всплывающее окно ввода */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 11, 18, 0.7);
    backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    z-index: 100;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-card { width: 350px; }
.modal-card input {
    width: 100%; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px;
    border-radius: 8px; color: #fff; margin-bottom: 20px; outline: none; box-sizing: border-box;
}
.modal-card input:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
.modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
.modal-buttons button { padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn-secondary { background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: #aaa; }
.btn-primary { background: #4facfe; border: none; color: #fff; }

@media (max-width: 900px) {
    .board-sections { grid-template-columns: 1fr; }
}
.container {
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            position: relative;
            overflow: hidden;
        }

        #stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #stars::before, #stars::after {
            content: "";
            position: absolute;
            inset: 0;
            background-repeat: repeat; 
            background-size: 100% 100vh; 
            animation: flyUp linear infinite;
        }

        /* Мелкие звёзды (50 штук) */
        #stars::before {
            /* Градиенты сгенерируются через JavaScript ниже */
            animation-duration: 25s;
        }

        /* Крупные звёзды (60 штук) */
        #stars::after {
            /* Градиенты сгенерируются через JavaScript ниже */
            animation-duration: 45s;
        }

        @keyframes flyUp {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 0 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="stars"></div>
<!-- Общий контейнер доски -->
    <div class="dashboard-container">
        
        <!-- ОБЩИЙ ПРОГРЕСС БАР -->
        <div class="progress-card">
            <h2>Мониторинг рабочих процессов</h2>
            <div class="progress-container">
                <div class="progress-text">
                    <span>Прогресс выполнения</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- ТРИ УЧАСТКА РАБОТЫ -->
        <div class="board-sections">
            
            <!-- УЧАСТОК 1 -->
            <div class="tasks-card" data-section="1">
                <div class="section-header">
                    <span class="section-badge badge-blue"></span>
                    <h3>Участок 1: Упаковка</h3>
                </div>
                <div class="subtasks-list" id="container-section-1"></div>
                <button class="add-task-btn" data-section="1"><span>+</span> Добавить задачу</button>
            </div>

            <!-- УЧАСТОК 2 -->
            <div class="tasks-card" data-section="2">
                <div class="section-header">
                    <span class="section-badge badge-purple"></span>
                    <h3>Участок 2: Сушилка</h3>
                </div>
                <div class="subtasks-list" id="container-section-2"></div>
                <button class="add-task-btn" data-section="2"><span>+</span> Добавить задачу</button>
            </div>

            <!-- УЧАСТОК 3 -->
            <div class="tasks-card" data-section="3">
                <div class="section-header">
                    <span class="section-badge badge-green"></span>
                    <h3>Участок 3: Эктрудер</h3>
                </div>
                <div class="subtasks-list" id="container-section-3"></div>
                <button class="add-task-btn" data-section="3"><span>+</span> Добавить задачу</button>
            </div>

        </div>

        
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВВОДА -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title">Новая подзадача</h3>
            <input type="text" id="task-input" placeholder="Что нужно сделать?" maxlength="100" autocomplete="off">
            <div class="modal-buttons">
                <button id="close-modal-btn" class="btn-secondary">Отмена</button>
                <button id="confirm-task-btn" class="btn-primary">Добавить</button>
            </div>
        </div>
    </div>
</div>

    <script>
        const progressBar = document.getElementById('progress-bar');
const progressPercent = document.getElementById('progress-percent');
const modalOverlay = document.getElementById('modal-overlay');
const taskInput = document.getElementById('task-input');
const modalTitle = document.getElementById('modal-title');
const closeModalBtn = document.getElementById('close-modal-btn');
const confirmTaskBtn = document.getElementById('confirm-task-btn');

let currentTargetSection = null;

// Инициализация ваших реальных базовых задач
const defaultDashboardData = [
    { text: "Почистить бочки", completed: true, section: "1" },
    { text: "Взять смывы", completed: true, section: "1" },
    { text: "Взять смывы", completed: true, section: "2" },
    { text: "Взять смывы", completed: true, section: "3" },
];

// 1. Расчет прогресс-бара по всей системе
function updateProgress() {
    const totalItems = document.querySelectorAll('.subtask-item');
    const completedItems = document.querySelectorAll('.subtask-item.completed');
    
    if (totalItems.length === 0) {
        progressBar.style.width = '0%';
        progressPercent.textContent = '0%';
        return;
    }

    const percentage = Math.round((completedItems.length / totalItems.length) * 100);
    progressBar.style.width = percentage + '%';
    progressPercent.textContent = percentage + '%';
}

// 2. Сохранение структуры в LocalStorage
function saveToLocalStorage() {
    const items = document.querySelectorAll('.subtask-item');
    const boardState = [];

    items.forEach(item => {
        const sectionId = item.closest('.tasks-card').getAttribute('data-section');
        boardState.push({
            text: item.querySelector('.task-text').textContent,
            completed: item.classList.contains('completed'),
            section: sectionId
        });
    });

    localStorage.setItem('productionBoardData_v3', JSON.stringify(boardState));
}

// 3. Создание элемента задачи
function createHtmlTaskRow(text, isCompleted) {
    const newItem = document.createElement('div');
    newItem.className = `subtask-item ${isCompleted ? 'completed' : ''}`;
    
    newItem.innerHTML = `
        <div class="checkbox"></div>
        <span class="task-text">${escapeHTML(text)}</span>
        <div class="delete-btn">&times;</div>
    `;
    return newItem;
}

// 4. Загрузка данных и распределение без дублей
function loadDashboard() {
    const savedData = localStorage.getItem('productionBoardData_v3');
    
    document.getElementById('container-section-1').innerHTML = '';
    document.getElementById('container-section-2').innerHTML = '';
    document.getElementById('container-section-3').innerHTML = '';

    const dataToRender = savedData ? JSON.parse(savedData) : defaultDashboardData;

    dataToRender.forEach(task => {
        const targetContainer = document.getElementById(`container-section-${task.section}`);
        if (targetContainer) {
            const row = createHtmlTaskRow(task.text, task.completed);
            targetContainer.appendChild(row);
        }
    });

    if (!savedData) saveToLocalStorage();
    updateProgress();
}

// 5. Логика модального окна
function openModal(sectionId) {
    currentTargetSection = sectionId;
    modalTitle.textContent = `Добавить на Участок ${sectionId}`;
    modalOverlay.classList.add('active');
    taskInput.value = '';
    taskInput.focus();
}

function closeModal() {
    modalOverlay.classList.remove('active');
    currentTargetSection = null;
}

function handleAddTask() {
    const taskText = taskInput.value.trim();
    if (taskText !== '' && currentTargetSection) {
        const targetContainer = document.getElementById(`container-section-${currentTargetSection}`);
        if (targetContainer) {
            const row = createHtmlTaskRow(taskText, false);
            targetContainer.appendChild(row);
            targetContainer.scrollTop = targetContainer.scrollHeight;
        }
        closeModal();
        updateProgress();
        saveToLocalStorage();
    }
}

// 6. Слушатели кликов
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('add-task-btn')) {
        const sectionId = e.target.getAttribute('data-section');
        openModal(sectionId);
        return;
    }

    if (e.target.classList.contains('delete-btn')) {
        const item = e.target.closest('.subtask-item');
        if (item) {
            item.remove();
            updateProgress();
            saveToLocalStorage();
        }
        return;
    }

    const item = e.target.closest('.subtask-item');
    if (item && !e.target.classList.contains('delete-btn')) {
        item.classList.toggle('completed');
        updateProgress();
        saveToLocalStorage();
    }
});

closeModalBtn.addEventListener('click', closeModal);
confirmTaskBtn.addEventListener('click', handleAddTask);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

taskInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleAddTask();
    if (e.key === 'Escape') closeModal();
});

function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

loadDashboard();

// Функция для создания случайных градиентов-звёзд
        function generateStars(count, size) {
            const starsArray = [];
            for (let i = 0; i < count; i++) {
                // Случайные координаты от 0% до 100%
                const x = Math.floor(Math.random() * 100);
                const y = Math.floor(Math.random() * 100);
                starsArray.push(`radial-gradient(${size}px ${size}px at ${x}% ${y}%, #fff 100%, transparent)`);
            }
            return starsArray.join(', ');
        }

        // Находим элемент со звёздами
        const starsContainer = document.getElementById('stars');

        // Генерируем по 40 звёзд разного размера для каждого слоя
        const smallStars = generateStars(50, 1);   /* 40 мелких звёзд по 1px */
        const mediumStars = generateStars(60, 2.5); /* 40 крупных звёзд по 2.5px */

        // Записываем их напрямую в CSS-переменные или стили тега через специальный хак для псевдоэлементов
        const style = document.createElement('style');
        style.textContent = `
            #stars::before { background-image: ${smallStars}; }
            #stars::after { background-image: ${mediumStars}; }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
